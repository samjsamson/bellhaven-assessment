name: Daily Bellhaven Reconciliation

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scrape_facilities.py

      - run: python fetch_crm.py
        env:
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}

      - run: python compare.py